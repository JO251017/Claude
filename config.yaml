# 모든 요율·기준값은 여기서만 정의한다 (코드 하드코딩 금지).
# 판매수수료: 스마트스토어 3%(VAT 포함, 2025-06-02 결제분부터, 공식 FAQ 15759). 판매자 마케팅 유입은 1%.
fee_sales_pct: 3.0
# Npay 주문관리 수수료(VAT 포함, 2025-10-01 결제분부터, 공식 FAQ 3713): 영세 1.947 / 중소1 2.563 / 중소2 2.728 / 중소3 3.003 / 일반 3.630
# 내 등급을 모르면 가장 높은 '일반'으로 둔다(보수적).
fee_payment_pct: 3.63
ad_rate_pct: 5
return_rate_pct: 3
margin_min_pct: 15
profit_min_won: 2000
discount_rate_pct: 0
fee_on_shipping: all        # all만 구현

# 부가세 반영 순이익(추정, 표시만): general = 일반과세자 (매출 - 수수료·광고비 - 원가·배송비) / 11 을 낼 부가세로 추정 / none = 면세·간이과세
vat_mode: general

stress:
  ad_rate_pct: 10
  return_rate_pct: 5
  fee_add_pp: 1

# M1
market_lowest_k: 3
growth_min_base: 1.0
growth_floor_pct: null      # null이면 하락 판정 없이 표시만
seasonal_max_mean_ratio: 2.5
spike_multiple: 3

# 최신성(M2 4장)
freshness:
  researched_at_days: 7
  wholesale_date_days: 14

# AI 노출 준비도: 네이버 쇼핑 AI 에이전트는 스펙·후기·도착 예정일을 근거로 추천한다(2026 보도).
# 후보 단계에서 확인 가능한 정보(스펙, 모델명·브랜드, 출고 소요일, 차별점)가 있는지 본다.
ai_readiness:
  affects_verdict: false     # true면 정보가 빠진 후보를 보류로 판정

# 키워드 발굴(모듈 0): 검색광고 키워드도구 + 쇼핑 검색 API (docs/api/)
discovery:
  api_terms_ack: false       # 검색광고 API·검색 API 약관 확인 후 true
  searchad_required_env: [NAVER_AD_API_KEY, NAVER_AD_SECRET_KEY, NAVER_AD_CUSTOMER_ID]   # 이름만
  searchad_base_url: https://api.searchad.naver.com
  shop_endpoint: https://openapi.naver.com/v1/search/shop.json
  shop_daily_limit: 25000    # 검색 API 공식 하루 한도
  max_candidates: 100        # 상품 수를 조회할 최대 키워드 수(호출량 상한, 검색수 많은 순)
  min_monthly_search: null   # 값을 넣으면 월간 검색수(PC+모바일)가 이보다 적은 키워드 제외

trend:
  min_interval_sec: 0.2
  retry_429_max: 3
  retry_429_backoff_sec: [1, 2, 4]
  retry_transient_max: 2
  retry_transient_backoff_sec: [1, 2]

# 네이버 데이터랩 쇼핑인사이트 API (docs/api/naver_datalab_shopping_keywords.md)
datalab:
  api_terms_ack: false       # 네이버 개발자센터 이용약관 확인 후 true (docs/RUN_REAL_API.md)
  required_env: [NAVER_CLIENT_ID, NAVER_CLIENT_SECRET]   # .env의 키 이름만. 값은 적지 않는다.
  endpoint: https://openapi.naver.com/v1/datalab/shopping/category/keywords
  daily_limit: 1000          # 공식 하루 호출 한도
  timeout_sec: 10

paths:
  db_path: output/mvp.db
  output_dir: output
  log_dir: output/logs
