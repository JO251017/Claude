<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FFF8F4" />
  <meta name="description" content="기록을 놓쳐도 쉽게 다시 시작하는 AI 가계부" />
  <title>모모 가계부</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="skip" href="#view">본문으로 건너뛰기</a>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <img src="icon.svg" alt="" width="28" height="28" />
        <h1 id="screen-title">모모 가계부</h1>
      </div>
      <button class="icon-btn" id="settings-btn" type="button" aria-label="설정: 예산, 카테고리, 백업">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" class="ico"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
      </button>
    </header>

    <main id="view" tabindex="-1"></main>

    <button class="fab" id="fab" type="button" aria-label="지출 기록하기">
      <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" class="ico"><path d="M12 5v14M5 12h14"/></svg>
    </button>

    <nav class="tabbar" aria-label="주요 메뉴">
      <button type="button" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true" class="ico"><path d="M3 11l9-7 9 7v8a2 2 0 0 1-2 2h-4v-6H9v6H5a2 2 0 0 1-2-2z"/></svg><span>홈</span></button>
      <button type="button" data-tab="history"><svg viewBox="0 0 24 24" aria-hidden="true" class="ico"><path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"/></svg><span>내역</span></button>
      <button type="button" data-tab="stats"><svg viewBox="0 0 24 24" aria-hidden="true" class="ico"><path d="M5 20V11M11 20V5M17 20v-6M3 20h18"/></svg><span>통계</span></button>
      <button type="button" data-tab="ai"><svg viewBox="0 0 24 24" aria-hidden="true" class="ico"><path d="M20 12a8 8 0 0 1-11.5 7.2L4 20l1-4.3A8 8 0 1 1 20 12z"/></svg><span>AI 코치</span></button>
      <button type="button" data-tab="momo"><svg viewBox="0 0 24 24" aria-hidden="true" class="ico"><path d="M12 20s-7.5-4.6-7.5-10.2A4.2 4.2 0 0 1 12 7.3a4.2 4.2 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20z"/></svg><span>모모</span></button>
    </nav>
  </div>

  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/core.js"></script>
  <script src="js/nlp.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
