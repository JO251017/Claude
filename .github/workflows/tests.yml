name: tests

on:
  push:
    branches: ["**"]
    paths:
      - "savemap/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "savemap/**"
      - ".github/workflows/tests.yml"

defaults:
  run:
    working-directory: savemap

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: savemap/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q
