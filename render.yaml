services:
  - type: web
    name: savemap-api
    runtime: docker
    plan: free
    rootDir: savemap
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: DATA_GO_KR_KEY
        sync: false
      - key: TOUR_API_KEY
        sync: false
      - key: OPINET_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: ADMIN_SYNC_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: savemap-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: savemap-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: savemap-redis
          property: connectionString

  - type: redis
    name: savemap-redis
    plan: free
    ipAllowList: []
